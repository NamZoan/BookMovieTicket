<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineSphere - Premium Movie Booking</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        
        /* Hiệu ứng Fade cho Slideshow */
        .slide {
            opacity: 0;
            z-index: 0;
            transform: scale(1.05);
            transition: all 1000ms ease-in-out;
            pointer-events: none;
        }
        
        .slide.active {
            opacity: 1;
            z-index: 10;
            transform: scale(1);
            pointer-events: auto;
        }

        /* Nội dung Slide trượt lên */
        .slide-content {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1000ms ease-in-out 300ms; /* Delay 300ms */
        }

        .slide.active .slide-content {
            opacity: 1;
            transform: translateY(0);
        }

        /* Modal Animation */
        #ai-modal.hidden { display: none; }
        #ai-modal { animation: fadeIn 0.2s ease-out; }
        #ai-modal-content { animation: zoomIn 0.3s ease-out; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-black text-white font-sans selection:bg-red-600 selection:text-white">

    <nav class="fixed top-0 left-0 w-full z-50 bg-black/50 backdrop-blur-lg border-b border-white/5">
        <div class="container mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="film" class="w-8 h-8 text-red-600"></i>
                <span class="text-2xl font-bold tracking-tighter">CineSphere</span>
            </div>

            <div class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-300">
                <a href="#" class="hover:text-white transition-colors">Movies</a>
                <a href="#" class="hover:text-white transition-colors">Cinemas</a>
                <a href="#" class="hover:text-white transition-colors">Experiences</a>
                <a href="#" class="hover:text-white transition-colors">Offers</a>
            </div>

            <div class="flex items-center space-x-4">
                <button class="p-2 hover:bg-white/10 rounded-full transition-colors"><i data-lucide="search" class="w-5 h-5"></i></button>
                <button class="p-2 hover:bg-white/10 rounded-full transition-colors"><i data-lucide="user" class="w-5 h-5"></i></button>
                <button class="md:hidden p-2 hover:bg-white/10 rounded-full transition-colors"><i data-lucide="menu" class="w-5 h-5"></i></button>
            </div>
        </div>
    </nav>

    <main class="pt-0">
        <div id="slideshow-container" class="relative w-full h-[85vh] overflow-hidden bg-black group">
            <div id="slides-wrapper"></div>

            <button onclick="changeSlide(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 p-3 rounded-full bg-black/20 text-white backdrop-blur-sm border border-white/10 hover:bg-white/20 hover:scale-110 transition-all z-20 hidden md:flex">
                <i data-lucide="chevron-left" class="w-8 h-8"></i>
            </button>
            <button onclick="changeSlide(1)" class="absolute right-4 top-1/2 -translate-y-1/2 p-3 rounded-full bg-black/20 text-white backdrop-blur-sm border border-white/10 hover:bg-white/20 hover:scale-110 transition-all z-20 hidden md:flex">
                <i data-lucide="chevron-right" class="w-8 h-8"></i>
            </button>

            <div id="dots-container" class="absolute bottom-8 left-1/2 -translate-x-1/2 flex space-x-3 z-20"></div>
            
            <div class="absolute bottom-0 left-0 w-full h-24 bg-gradient-to-t from-black to-transparent z-10 pointer-events-none"></div>
        </div>

        <section class="container mx-auto px-6 py-20">
            <h2 class="text-3xl font-bold mb-8">Now Showing</h2>
            <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                </div>
        </section>
    </main>

    <div id="ai-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
        <div id="ai-modal-content" class="relative w-full max-w-lg overflow-hidden bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl">
            <div class="flex items-center justify-between p-6 border-b border-gray-800 bg-gradient-to-r from-purple-900/20 to-blue-900/20">
                <div class="flex items-center space-x-2">
                    <i data-lucide="sparkles" class="w-5 h-5 text-purple-400"></i>
                    <h3 class="text-lg font-bold text-white">AI Critic's Take</h3>
                </div>
                <button onclick="closeModal()" class="p-1 text-gray-400 rounded-full hover:text-white hover:bg-gray-800 transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="p-8">
                <div class="mb-6 flex items-center space-x-4">
                    <img id="modal-movie-img" src="" alt="" class="w-16 h-24 object-cover rounded-md shadow-lg" />
                    <div>
                        <h4 id="modal-movie-title" class="text-xl font-bold text-white"></h4>
                        <p id="modal-movie-genre" class="text-sm text-gray-400"></p>
                    </div>
                </div>

                <div class="relative min-h-[100px]">
                    <div id="modal-loader" class="absolute inset-0 flex flex-col items-center justify-center text-purple-300 hidden">
                        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-2"></i>
                        <span class="text-sm animate-pulse">Consulting the digital oracle...</span>
                    </div>
                    <p id="modal-text" class="text-lg leading-relaxed text-gray-200 font-medium"></p>
                </div>
            </div>

            <div class="p-4 bg-gray-950/50 text-center text-xs text-gray-500">
                Powered by Gemini 3 Flash
            </div>
        </div>
    </div>

    <script>
        // --- 1. DATA (Mock Data vì không có file constants) ---
        const MOVIES = [
            {
                id: 1,
                title: "Inception",
                tagline: "Your mind is the scene of the crime.",
                description: "A thief who steals corporate secrets through the use of dream-sharing technology is given the inverse task of planting an idea into the mind of a C.E.O.",
                image: "https://image.tmdb.org/t/p/original/s3TBrRGB1jav7nR4GnSXn713ROT.jpg",
                genre: ["Sci-Fi", "Action"],
                rating: 8.8,
                duration: "2h 28m",
                releaseDate: "2010"
            },
            {
                id: 2,
                title: "Dune: Part Two",
                tagline: "Long live the fighters.",
                description: "Paul Atreides unites with Chani and the Fremen while on a warpath of revenge against the conspirators who destroyed his family.",
                image: "https://image.tmdb.org/t/p/original/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg",
                genre: ["Sci-Fi", "Adventure"],
                rating: 8.9,
                duration: "2h 46m",
                releaseDate: "2024"
            },
            {
                id: 3,
                title: "Interstellar",
                tagline: "Mankind was born on Earth. It was never meant to die here.",
                description: "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.",
                image: "https://image.tmdb.org/t/p/original/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
                genre: ["Sci-Fi", "Drama"],
                rating: 8.7,
                duration: "2h 49m",
                releaseDate: "2014"
            }
        ];

        // --- 2. GLOBAL VARIABLES ---
        let currentIndex = 0;
        let isAutoPlaying = true;
        let slideInterval;

        // --- 3. INIT FUNCTION ---
        document.addEventListener('DOMContentLoaded', () => {
            renderSlides();
            renderGrid();
            startAutoPlay();
            lucide.createIcons(); // Khởi tạo icons

            // Hover event cho slideshow
            const container = document.getElementById('slideshow-container');
            container.addEventListener('mouseenter', () => {
                isAutoPlaying = false;
                clearInterval(slideInterval);
            });
            container.addEventListener('mouseleave', () => {
                isAutoPlaying = true;
                startAutoPlay();
            });
        });

        // --- 4. RENDER LOGIC ---
        function renderSlides() {
            const wrapper = document.getElementById('slides-wrapper');
            const dotsContainer = document.getElementById('dots-container');
            
            wrapper.innerHTML = MOVIES.map((movie, index) => `
                <div class="slide absolute inset-0 w-full h-full ${index === 0 ? 'active' : ''}" id="slide-${index}">
                    <div class="absolute inset-0">
                        <img src="${movie.image}" alt="${movie.title}" class="w-full h-full object-cover" />
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                        <div class="absolute inset-0 bg-gradient-to-r from-black via-black/30 to-transparent"></div>
                    </div>
                    
                    <div class="absolute inset-0 flex items-center container mx-auto px-6 md:px-12">
                        <div class="slide-content max-w-3xl">
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${movie.genre.map(g => `<span class="px-3 py-1 text-xs font-bold uppercase text-white bg-white/10 backdrop-blur-md border border-white/20 rounded-full">${g}</span>`).join('')}
                            </div>
                            <h1 class="text-5xl md:text-7xl font-black text-white mb-2 leading-tight drop-shadow-2xl">${movie.title}</h1>
                            <p class="text-xl md:text-2xl text-gray-300 italic mb-6 font-light">${movie.tagline}</p>
                            
                            <div class="flex items-center space-x-6 mb-8 text-gray-200">
                                <div class="flex items-center"><i data-lucide="star" class="w-5 h-5 text-yellow-400 fill-current mr-2"></i><b>${movie.rating}</b>/10</div>
                                <div class="flex items-center"><i data-lucide="clock" class="w-5 h-5 mr-2"></i>${movie.duration}</div>
                                <div class="flex items-center"><i data-lucide="calendar" class="w-5 h-5 mr-2"></i>${movie.releaseDate}</div>
                            </div>

                            <p class="text-lg text-gray-300 mb-10 leading-relaxed max-w-2xl line-clamp-3 md:line-clamp-none">${movie.description}</p>
                            
                            <div class="flex flex-wrap gap-4">
                                <button onclick="alert('Booking ticket: ${movie.title}')" class="bg-red-600 hover:bg-red-700 text-white shadow-lg px-6 py-3 rounded-full font-semibold transition-all">Book Ticket</button>
                                <button onclick="alert('Playing Trailer...')" class="bg-black/30 backdrop-blur-md border border-white/10 text-white hover:bg-black/50 px-6 py-3 rounded-full font-semibold inline-flex items-center"><i data-lucide="play-circle" class="w-5 h-5 mr-2"></i>Watch Trailer</button>
                                <button onclick="openModal(${movie.id})" class="border-2 border-purple-500/50 text-purple-200 hover:bg-purple-900/20 px-6 py-3 rounded-full font-semibold inline-flex items-center"><i data-lucide="sparkles" class="w-4 h-4 mr-2"></i>Why Watch?</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            dotsContainer.innerHTML = MOVIES.map((_, index) => `
                <button onclick="goToSlide(${index})" id="dot-${index}" class="h-1.5 rounded-full transition-all duration-300 ${index === 0 ? 'w-12 bg-red-600' : 'w-6 bg-white/30 hover:bg-white/60'}"></button>
            `).join('');
        }

        function renderGrid() {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = MOVIES.map(movie => `
                <div class="group cursor-pointer">
                    <div class="relative aspect-[2/3] overflow-hidden rounded-lg mb-3">
                        <img src="${movie.image}" alt="${movie.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <button class="bg-red-600 text-white px-6 py-2 rounded-full font-bold transform translate-y-4 group-hover:translate-y-0 transition-all duration-300">Book</button>
                        </div>
                    </div>
                    <h3 class="font-bold text-lg truncate group-hover:text-red-500 transition-colors">${movie.title}</h3>
                    <p class="text-gray-500 text-sm">${movie.genre[0]}</p>
                </div>
            `).join('');
        }

        // --- 5. CONTROLS ---
        function updateClasses() {
            // Update Slides
            document.querySelectorAll('.slide').forEach((el, idx) => {
                if (idx === currentIndex) el.classList.add('active');
                else el.classList.remove('active');
            });
            // Update Dots
            document.querySelectorAll('#dots-container button').forEach((el, idx) => {
                if (idx === currentIndex) {
                    el.className = 'h-1.5 rounded-full transition-all duration-300 w-12 bg-red-600';
                } else {
                    el.className = 'h-1.5 rounded-full transition-all duration-300 w-6 bg-white/30 hover:bg-white/60';
                }
            });
        }

        function changeSlide(direction) {
            currentIndex = (currentIndex + direction + MOVIES.length) % MOVIES.length;
            updateClasses();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateClasses();
        }

        function startAutoPlay() {
            clearInterval(slideInterval);
            slideInterval = setInterval(() => changeSlide(1), 6000);
        }

        // --- 6. MODAL LOGIC (Mock AI) ---
        function openModal(movieId) {
            const movie = MOVIES.find(m => m.id === movieId);
            if (!movie) return;

            // Setup Modal Data
            document.getElementById('modal-movie-img').src = movie.image;
            document.getElementById('modal-movie-title').innerText = movie.title;
            document.getElementById('modal-movie-genre').innerText = movie.genre.join(', ');
            
            const modal = document.getElementById('ai-modal');
            const loader = document.getElementById('modal-loader');
            const textEl = document.getElementById('modal-text');

            modal.classList.remove('hidden');
            loader.classList.remove('hidden');
            textEl.innerText = ''; // Clear old text

            // Simulate API Call
            setTimeout(() => {
                loader.classList.add('hidden');
                textEl.innerText = `Here is a Gemini-generated reason to watch ${movie.title}. The cinematography is breathtaking, combining ${movie.genre[0]} elements with a deep emotional core. It's a ${movie.rating}/10 masterpiece that explores themes relevant to our time.`;
            }, 2000); // 2 seconds delay
        }

        function closeModal() {
            document.getElementById('ai-modal').classList.add('hidden');
        }

        // Close modal on clicking outside
        document.getElementById('ai-modal').addEventListener('click', (e) => {
            if (e.target.id === 'ai-modal') closeModal();
        });
    </script>
</body>
</html>
